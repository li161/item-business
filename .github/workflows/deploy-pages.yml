name: Deploy curtain showroom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Three.js module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text()
          start = html.index('<script type="module">') + len('<script type="module">')
          end = html.index('</script>', start)
          Path('/tmp/curtain-lab-check.js').write_text(html[start:end])
          PY
          node -e 'const fs=require("fs");const s=fs.readFileSync("/tmp/curtain-lab-check.js","utf8").split("\\n").filter(x=>!x.trim().startsWith("import ")).join("\\n");new Function(s);console.log("Three.js module syntax: OK")'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
